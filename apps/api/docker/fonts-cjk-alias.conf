<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  video_render.py 生成的 ASS 字幕把字体写死为 Microsoft YaHei，
  而该字体受微软授权限制、不能随镜像分发。这里把它别名到开源中文字体，
  让 libass（ffmpeg subtitles 滤镜）能解析到实际字形，否则硬字幕会是方块。
-->
<fontconfig>
  <alias binding="same">
    <family>Microsoft YaHei</family>
    <accept><family>WenQuanYi Micro Hei</family></accept>
  </alias>
  <alias binding="same">
    <family>Microsoft YaHei UI</family>
    <accept><family>WenQuanYi Micro Hei</family></accept>
  </alias>
  <alias binding="same">
    <family>PingFang SC</family>
    <accept><family>WenQuanYi Micro Hei</family></accept>
  </alias>
</fontconfig>
