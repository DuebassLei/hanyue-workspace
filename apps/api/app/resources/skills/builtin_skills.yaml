# 内置 Skill 定义：服务端唯一的出厂数据来源。
#
# 维护规则：
# 1. 新增/修改内置 Skill 只改这里，重启后自动同步到 skill_registry_entries；
# 2. 改了内容必须同步抬高 version，checksum 由服务端统一计算，不要手填；
# 3. category: flow 是流程型 Skill（供 Agent 编排），style 是写作风格（供 AI 成文）；
# 4. style 不需要写 promptTemplate，服务端注入统一输出契约模板，避免 13 份重复；
# 5. tools 只能用 agent_policy.TOOL_CATALOG 里登记且非 forbidden 的工具，写错启动即失败。
version: 1
skills:
  # ---------------- 流程型 ----------------
  - key: topic-research
    version: "1.0.0"
    name: 选题调研
    description: 检索工作区稿件、扩展角度并给出候选标题。
    category: flow
    tools: [read_content]
    manifest: {}

  - key: article-drafting
    version: "1.2.0"
    name: 公众号热点成文
    description: 基于选题生成公众号文章（Markdown + 排版 + 配图提示词）。可自定义语气风格。
    category: flow
    tools:
      [
        create_outline,
        generate_article,
        review_article,
        check_ai_tone,
        extract_facts,
        plan_images,
        retrieve_content,
      ]
    manifest:
      tone: 语气平实有深度，结构清晰，善用小标题和引用
      styleRules:
        - 不用 emoji
        - 不用绝对化承诺（如「100%有效」）
        - "善用 ## 小标题拆分段落"
        - "关键信息用 > 引用块突出"
        - "数据、步骤、对比、清单、金句按需用对应区块，不要为了用而用"
      defaultTheme: ink-green
      workflow:
        - tool: create_outline
          args: {}
        - tool: generate_article
          args: {}
        - tool: review_article
          args: {}
        - tool: check_ai_tone
          args: {}
        - tool: plan_images
          args: {}
      reviewRules:
        - id: has-body
          kind: min_chars
          field: markdown
          value: 80
          message: 正文过短
        - id: no-absolute
          kind: not_contains
          field: markdown
          value: "100%有效"
          message: 含绝对化承诺
      imagePolicy:
        coverAspectRatio: "3:4"
        inlineAspectRatio: "1:1"
        maxInlineImages: 3
        allowAiImages: true
      factPolicy:
        forbidUnverifiedQuotes: true
        placeholder: "〔待核实〕"
      repairPolicy:
        retries: 0
        requireContract: false

  - key: publish-prep
    version: "1.0.0"
    name: 发布准备
    description: 生成平台版本与发布预览，不直接发布。
    category: flow
    tools: [prepare_platform_variant, create_publish_preview]
    manifest: {}

  # ---------------- 写作风格 ----------------
  - key: style-tech-article
    version: "1.0.0"
    name: 科技数码·实测派
    description: 好选题加事实讲透，作者在场却不表演
    category: style
    tools: [generate_article]
    manifest:
      tone: 第一人称在场，语气克制，多写实测细节，重判断后置，不喊口号
      styleRules:
        - 结构：开头用亲切自述，抛出一个具体真问题
        - 结构：主体层层剥开：现象、解释、追问、洞察
        - 结构：论据以事实为主，数据、故事、引语交织
        - 结构：结尾升维到文化人性，或白话收束
        - 禁冒号破折号感叹号，引号用「」
        - 数据密度不超过全篇四成
        - 禁用赋能、抓手、闭环等商业黑话
        - 少用段末钩子，不写「接下来我们看」
        - 产品名首次出现后保持英文
        - 禁「重大突破」等无证据断言
      defaultTheme: deep-blue

  - key: style-news-and-gov
    version: "1.0.0"
    name: 资讯政务·核实派
    description: 准优先于快，作者隐身，事实即威信
    category: style
    tools: [generate_article]
    manifest:
      tone: 作者退到记录员位置，冷静陈述，多用时间、地点、数字与引语，不抒情不评判
      styleRules:
        - 结构：开头用事实卡，三句话说清五要素
        - 结构：主体用时间戳串珠推进，不用「首先其次」
        - 结构：多方原话并列：官方、当事人、专家
        - 结构：结尾在未完成时收束，配一个具体动作
        - 结构：政策类改文件线，结尾给行动清单
        - 事实段与评论段分层，不混写
        - 禁「惊天动地」「令人痛心」等形容
        - 禁「让我们一起祈祷」式编辑腔
        - 未核实信息注明出处并标明未定
        - 感叹号仅限引用官方通报原文
        - 敏感人脸与遗体画面必须处理
      defaultTheme: deep-blue

  - key: style-culture-emotion
    version: "1.0.0"
    name: 文化情感·说破派
    description: 一个具体的人，一句想被截图的话
    category: style
    tools: [generate_article]
    manifest:
      tone: 以同代朋友的口吻叙述，情绪克制，最重的一句写得最短，不评价不说教
      styleRules:
        - 结构：开头对准一个具体的人：名字、年龄、场景一句话
        - 结构：中段用事件、对话、转折推进，穿插短句高点
        - 结构：关键句独占一段，前后留白
        - 结构：结尾只给一个姿态，不给结论
        - 禁「亲爱的」「家人们」「集美们」
        - 禁「干货」「方法论」「五步法」
        - 不写「让我们一起」「共勉」口号
        - 第二人称「你」全篇不超三四次
        - 不虚构「我的一位朋友」骗共情
        - 当事人须化名并做面部处理
      defaultTheme: warm-orange

  - key: style-finance-analysis
    version: "1.0.0"
    name: 财经财富·判断派
    description: 一手数据，敢下判断，明说前提
    category: style
    tools: [generate_article]
    manifest:
      tone: 像懂行分析师在饭桌聊天，结论前置、敢下判断，但每一步都给来源与前提
      styleRules:
        - 结构：开头三句给一个反直觉的数据反差
        - 结构：开头四百字内给出明确结论
        - 结构：中段用数据交叉印证，拼出独家判断
        - 结构：给一个可复用的分析框架
        - 结构：结尾给一个动作，或明确免责
        - 每个数字标注公开数据来源
        - 结论后明说前提假设与失效条件
        - 禁荐股荐基与稳赚不赔承诺
        - 禁改数据轴或掐头去尾造错觉
        - 不写「未来可期」「值得关注」空话
      defaultTheme: deep-blue

  - key: style-knowledge-popsci
    version: "1.0.0"
    name: 知识科普·讲懂派
    description: 用类比把复杂讲清，再明说边界
    category: style
    tools: [generate_article]
    manifest:
      tone: 像耐心的老师在你面前讲，术语先解释，多用类比，不端着不炫技
      styleRules:
        - 结构：开头从读者遇到过的具体场景切入
        - 结构：全篇用一个新鲜准确的类比贯穿
        - 结构：讲清后再追问一层，追问三到四层
        - 结构：结尾给一句能复述的总结
        - 结构：末尾分层说清该自己做还是找专业
        - 禁把单一小样本写成科学定论
        - 预印本与论文引用须标出处
        - 不做超出资质的具体诊疗建议
        - 类比要说明哪里不精确
        - 禁「XX 五大好处」式罗列
      defaultTheme: ink-green

  - key: style-fashion-lifestyle
    version: "1.0.0"
    name: 时尚生活·审美派
    description: 一个可复述的主张，每件挂具体场景
    category: style
    tools: [generate_article]
    manifest:
      tone: 像比你时髦一点的朋友翻衣橱，有主张、有细节、有节制，不夸大功效
      styleRules:
        - 结构：开头先立一句可复述的生活方式主张
        - 结构：每件单品明确挂一个具体使用场景
        - 结构：按预算、体型、户型主动分层推荐
        - 结构：结尾从单品升到审美与活法
        - 用材质、剪裁、成分、克重代替「高级」
        - 主动说一件测过但不推荐的东西
        - 禁疗效承诺与「立竿见影」表述
        - 禁虚构素人推荐包装商务合作
        - AI 图不伪造上身与试色
      defaultTheme: warm-orange

  - key: style-food-travel
    version: "1.0.0"
    name: 美食旅行·到场派
    description: 到场才可信，一个暗知识加信息卡
    category: style
    tools: [generate_article]
    manifest:
      tone: 像刚从现场回来的朋友讲见闻，多用感官细节与取舍判断，落到实处
      styleRules:
        - 结构：开头给一个只有到场才写出的感官细节
        - 结构：每店每站紧跟一张实用信息卡
        - 结构：中段埋一个只有到过才懂的暗知识
        - 结构：主动说一家去过但不推荐的地方
        - 结构：结尾给一句关于吃或旅行的私人观察
        - 禁「好吃」「香」「层次丰富」等词
        - 禁用图库图与 AI 图伪造现场
        - 人均与营业时间如实，不夸大
        - 商务合作须开头或结尾明示
        - 食安指控须基于可验证事实
      defaultTheme: warm-orange

  - key: style-people-profile
    version: "1.0.0"
    name: 人物特稿·立人派
    description: 一个动作立一个人，镜头稳而克制
    category: style
    tools: [generate_article]
    manifest:
      tone: 镜头始终对准人物，语气安静克制，只用看得见听得到的细节，不代言
      styleRules:
        - 结构：开头落在此人某个具体动作上
        - 结构：前三段说清这是谁、为何值得读
        - 结构：全篇找一个只属于他的私人细节
        - 结构：至少给一个公允的对立面声音
        - 结构：结尾用动作、物件或原话收束
        - 禁编造对话、细节与心理活动
        - 引语只留最锋利几句并给出处
        - 大段贴采访原话视为偷懒
        - 不消费遗容病榻与家属崩溃
        - 不俯视不仰视，不做人格审判
      defaultTheme: mono

  - key: style-film-tv-review
    version: "1.0.0"
    name: 影视剧评·拆镜派
    description: 反共识视角，拆到镜头级细节
    category: style
    tools: [generate_article]
    manifest:
      tone: 懂行但不装的评论人，先给反共识判断，再用场景细节验证，尊重剧透边界
      styleRules:
        - 结构：开头一行明示剧透范围
        - 结构：先复述主流两派，再抛反共识观点
        - 结构：挑一场关键戏拆到镜头与秒级
        - 结构：用三四个平行场景交叉印证
        - 结构：结尾从这一部升到这一类
        - 用动作代替剧情复述
        - 禁大段剧情复述当评论
        - 主动承认这种手法的代价
        - 批评作品不攻击演员容貌私生活
        - 不炒 CP，不放大饭圈骂战
      defaultTheme: mono

  - key: style-activity-marketing
    version: "1.0.0"
    name: 活动营销·转化派
    description: 前三行讲清是什么，一个明确 CTA
    category: style
    tools: [generate_article]
    manifest:
      tone: 像会推荐给朋友的人说话，利益前置、门槛透明、有取舍，不吆喝不空喊
      styleRules:
        - 结构：前三行说清是什么、何时、为何点
        - 结构：中段给三到五个具体亮点
        - 结构：门槛信息前置，不藏不含糊
        - 结构：明说这个活动不适合谁
        - 结构：结尾只给一个具体 CTA
        - 用名词、数字、名字代替形容词
        - 禁「最」「第一」「国家级」等词
        - 禁疗效、收益、中奖承诺
        - 不虚构参与人数与用户评价
        - 抽奖规则必须公示
      defaultTheme: warm-orange
