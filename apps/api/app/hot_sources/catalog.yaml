# 热榜采集源注册表（单一真相源）。
#
# 维护规则：
# 1. 新增一个平台 = 这里加一条声明；采集主流程零改动。
# 2. id 落库语义稳定，改名等于新平台；name 是展示名，也是 HOT_TOPICS_PLATFORMS 的过滤值。
# 3. kind 决定 Adapter 模板：json→JsonAdapter，markdown/html→TextPatternAdapter，script→ScriptAdapter。
#    adapter 写模板入口（模块:类）；parser 是该模板下的内置解析策略，对应 parsers._rows_*。
# 4. 结构全新的 JSON 源：parser=direct 配 items_path/title_keys/hot_keys/url_keys 即可，0 行代码。
#    实在特殊的写 ScriptAdapter 脚本（app/hot_sources/scripts/ 下），kind=script + adapter=模块:函数。
# 5. 所有出站请求强制走 ssrf.safe_request（HTTPS/端口白名单/逐跳校验），requires_ssrf_safe 不可关闭。
# 6. url_env 存在时其环境变量值覆盖 url；keyword_env 为空则该源跳过（不算失败）。
# 7. allow_empty=true 表示「本来就可能没数据」，不标注 selector_may_changed。

version: 1
sources:
  - id: toutiao
    name: 今日头条
    kind: json
    adapter: app.hot_sources.adapters:JsonAdapter
    parser: direct
    enabled: true
    timeout_seconds: 12
    retry: 1
    requires_ssrf_safe: true
    tags: [social, general]
    url: "https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
    options:
      items_path: [data]
      title_keys: [Title, title]
      hot_keys: [HotValue, hot_value]
      url_keys: [Url, url]

  - id: baidu
    name: 百度
    kind: json
    adapter: app.hot_sources.adapters:JsonAdapter
