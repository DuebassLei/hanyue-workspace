# 站点配置：静态前端 + /api 反向代理到 api 容器
# 由 infra/docker-compose.yml 挂载到 /etc/nginx/conf.d/default.conf（只读）。
# 修改后执行：docker compose exec web nginx -s reload（无需重建镜像）

# 容器内 DNS：api 容器重建后 IP 可能变化，用变量 + resolver 让 nginx 每次重新解析，
# 否则 nginx 只在启动时解析一次，api 重启后会持续 502。
resolver 127.0.0.11 ipv6=off valid=10s;
set $api_upstream "api:8000";

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 MAX_UPLOAD_BYTES（20MB）对齐，留一点头部余量
    client_max_body_size 25m;
    client_body_timeout 60s;

    # 压缩：Vue 打包后的 js/css/json 收益明显
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff font/woff2;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # 容器健康检查
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 带哈希的构建产物：可长期缓存
    # 只用 add_header，不叠加 expires，避免产生两条 Cache-Control
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口 HTML 不缓存，否则发版后用户仍加载旧 chunk 映射
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # API 反向代理：保留原始 URI（含查询串），不剥前缀
    location /api/ {
        proxy_pass http://$api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # 长任务（AI 生成、批量导出）读超时放宽；上传由 client_max_body_size 控制
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        # 关闭缓冲，兼容可能的分块/流式响应
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # SPA：vue-router 使用 history 模式，未命中的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
